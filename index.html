<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>807 听力拼写</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --ink:#1f1f1f; --mute:#9a9a9a; --ok:#2e9d4f; --bad:#d64541; --acc:#3b6fd8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:36px 20px 60px; min-height:100vh; display:flex; flex-direction:column; }
  .hidden { display:none !important; }
  .muted { color:var(--mute); font-size:14px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .big { width:100%; font-size:20px; padding:18px; border:0; border-radius:14px; background:var(--ink); color:#fff; cursor:pointer; margin-top:22px; }
  .ghost { background:transparent; color:var(--ink); border:2px solid #ddd; font-size:16px; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:14px; }
  .g { border:2px solid #e3e1da; background:var(--card); border-radius:10px; padding:8px 4px; text-align:center; cursor:pointer; font-size:15px; }
  .g small { display:block; color:var(--mute); font-size:11px; margin-top:2px; }
  .g.cur { border-color:var(--acc); }
  .g.full { background:#eaf6ee; border-color:#bfe3c9; }
  details { margin-top:26px; }
  summary { cursor:pointer; color:var(--mute); font-size:14px; }
  /* play */
  .top { display:flex; justify-content:space-between; align-items:center; }
  .x { background:none; border:0; font-size:15px; color:var(--mute); cursor:pointer; }
  .dots { display:flex; gap:6px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#ddd; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.now { outline:2px solid var(--ink); outline-offset:1px; }
  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .play { width:112px; height:112px; border-radius:50%; border:0; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.08); font-size:44px; cursor:pointer; }
  .slow { margin-top:10px; background:none; border:0; color:var(--acc); cursor:pointer; font-size:14px; }
  input { width:100%; margin-top:28px; font-size:28px; text-align:center; padding:14px; border:2px solid #ddd; border-radius:14px; outline:none; background:var(--card); }
  input:focus { border-color:var(--acc); }
  input.ok { border-color:var(--ok); } input.bad { border-color:var(--bad); }
  .fb { min-height:70px; margin-top:16px; font-size:22px; }
  .fb .ans { font-size:30px; letter-spacing:1px; }
  .fb .miss { color:var(--bad); text-decoration:underline; }
  .keys { margin-top:8px; }
  .zh { font-size:19px; color:#555; margin-top:6px; }
  .score { font-size:56px; margin:10px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <section id="home">
    <h1>🎧 807 听力拼写</h1>
    <div class="muted">听一个词 → 拼出来。每轮 10 个，约 3 分钟。</div>
    <button class="big" id="go"></button>
    <button class="big ghost hidden" id="goBook"></button>
    <button class="big ghost" id="goDates">📅 月份 + 星期专练（19 词）</button>
    <details>
      <summary>换一组（共 19 组）</summary>
      <div class="grid" id="grid"></div>
    </details>
  </section>

  <!-- 做题 -->
  <section id="play" class="hidden">
    <div class="top"><div class="dots" id="dots"></div><button class="x" id="quit">✕ 退出</button></div>
    <div class="stage">
      <button class="play" id="pl" title="重播（Tab）">🔊</button>
      <button class="slow" id="sl">🐢 慢速再听</button>
      <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="听到什么拼什么">
      <div class="fb" id="fb"></div>
      <div class="muted keys" id="keys">回车 提交 · Tab 重播</div>
    </div>
  </section>

  <!-- 结束 -->
  <section id="end" class="hidden">
    <div class="stage" style="min-height:70vh">
      <div class="score" id="sc"></div>
      <div class="muted" id="scTip"></div>
      <button class="big" id="again">再来一轮（回车）</button>
      <button class="big ghost" id="back">回首页</button>
    </div>
  </section>

</div>
<script src="words.js"></script>
<script>
const W = window.WANGLU807, ZH = window.WANGLU807_ZH || [], N = 10, SIZE = 100, NG = Math.ceil(W.length / SIZE);
const $ = id => document.getElementById(id);
const LS = { get: (k, d) => { try { return JSON.parse(localStorage.getItem("w807_" + k)) ?? d; } catch { return d; } },
             set: (k, v) => localStorage.setItem("w807_" + k, JSON.stringify(v)) };
let known = new Set(LS.get("known", [])), book = LS.get("book", {}), cur = LS.get("cur", 0);
let round = [], idx = 0, res = [], state = "idle", retype = false, audio = null, mode = "group";

const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' -]/g, "").replace(/[\s-]+/g, " ").trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gRange = g => [g * SIZE, Math.min((g + 1) * SIZE, W.length)];
const gDone = g => { const [a, b] = gRange(g); let n = 0; for (let i = a; i < b; i++) if (known.has(i)) n++; return [n, b - a]; };
const save = () => { LS.set("known", [...known]); LS.set("book", book); LS.set("cur", cur); };

function show(id) { ["home", "play", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
function home() {
  state = "idle"; show("home");
  const [n, t] = gDone(cur);
  $("go").textContent = `▶ 开始：第 ${cur + 1} 组（${n}/${t}）`;
  const nb = Object.keys(book).length;
  $("goBook").classList.toggle("hidden", !nb);
  $("goBook").textContent = `📕 错词本（${nb}）`;
  $("grid").innerHTML = Array.from({ length: NG }, (_, g) => {
    const [d, t] = gDone(g);
    return `<div class="g ${g === cur ? "cur" : ""} ${d === t ? "full" : ""}" data-g="${g}">第 ${g + 1} 组<small>${d}/${t}</small></div>`;
  }).join("");
  document.querySelectorAll(".g").forEach(el => el.onclick = () => { cur = +el.dataset.g; save(); home(); });
}
function start(m) {
  mode = m;
  if (m === "book") round = shuffle(Object.keys(book).map(Number)).slice(0, N);
  else if (m === "dates") round = shuffle(W.map((w, i) => i).filter(i => /^(January|February|March|April|May|June|July|August|September|October|November|December|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)$/.test(W[i]))).slice(0, N);
  else {
    const [a, b] = gRange(cur), all = Array.from({ length: b - a }, (_, i) => a + i);
    const wrong = all.filter(i => book[i]), fresh = all.filter(i => !known.has(i) && !book[i]), rest = all.filter(i => known.has(i) && !book[i]);
    round = shuffle([...shuffle(wrong).slice(0, 3), ...shuffle(fresh), ...shuffle(rest)].slice(0, N));
  }
  if (!round.length) return home();
  idx = 0; res = []; show("play"); next();
}
function dots() { $("dots").innerHTML = round.map((_, i) => `<div class="dot ${res[i] === true ? "ok" : res[i] === false ? "bad" : ""} ${i === idx ? "now" : ""}"></div>`).join(""); }
function speak(slow) {
  const i = round[idx];
  if (audio) audio.pause();
  audio = new Audio(`audio/${String(i + 1).padStart(4, "0")}.mp3`);
  audio.playbackRate = slow ? 0.7 : 1;
  audio.onerror = () => { const u = new SpeechSynthesisUtterance(W[i]); u.lang = "en-GB"; u.rate = slow ? 0.55 : 0.85; speechSynthesis.speak(u); };
  audio.play().catch(audio.onerror);
}
function next() {
  if (idx >= round.length) return end();
  state = "ask"; retype = false; dots();
  $("inp").value = ""; $("inp").className = ""; $("inp").placeholder = "听到什么拼什么"; $("fb").innerHTML = "";
  $("keys").textContent = "回车 提交 · Tab 重播";
  $("inp").focus(); setTimeout(() => speak(false), 150);
}
function diff(t, c) { // 标出漏/错的字母（LCS）
  const a = t.toLowerCase(), b = c.toLowerCase(), m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (j < n) { if (i < m && a[i] === b[j]) { out += c[j]; i++; j++; } else if (i < m && L[i + 1][j] >= L[i][j + 1]) i++; else { out += `<span class="miss">${c[j]}</span>`; j++; } }
  return out;
}
function submit() {
  const v = $("inp").value, i = round[idx], w = W[i];
  if (!norm(v)) return;
  if (retype) { // 错了必须照着拼对一次
    if (norm(v) === norm(w)) { idx++; next(); } else { $("inp").className = "bad"; $("inp").value = ""; }
    return;
  }
  const ok = norm(v) === norm(w);
  res[idx] = ok; dots();
  if (ok) {
    $("inp").className = "ok"; $("fb").innerHTML = `✅ <span class="ans">${w}</span><div class="zh">${ZH[i] || ""}</div>`;
    known.add(i); if (book[i] && --book[i] <= 0) delete book[i]; save();
    state = "wait"; setTimeout(() => { if (state === "wait") { idx++; next(); } }, 1300);
  } else {
    $("inp").className = "bad"; $("fb").innerHTML = `<span class="ans">${diff(v, w)}</span><div class="zh">${ZH[i] || ""}</div><div class="muted">你写的：${v.replace(/</g, "&lt;")}</div>`;
    book[i] = 2; save();
    retype = true; $("inp").value = ""; $("inp").placeholder = "照着拼一遍"; $("keys").textContent = "照着正确拼写打一遍 → 回车";
    speak(false);
  }
}
function end() {
  state = "end"; show("end");
  const n = res.filter(Boolean).length;
  $("sc").textContent = `${n} / ${round.length}`;
  const [d, t] = gDone(cur);
  $("scTip").textContent = mode === "book" ? `错词本还剩 ${Object.keys(book).length} 个` : mode === "dates" ? "雅思不扣大小写，但字母一个都不能错；再来一轮换一批" : `第 ${cur + 1} 组已拼对 ${d}/${t}` + (d === t ? " 🎉 可以换下一组了" : "");
  if (mode === "group" && d === t && cur < NG - 1) { cur++; save(); }
}
$("go").onclick = () => start("group");
$("goBook").onclick = () => start("book");
$("goDates").onclick = () => start("dates");
$("again").onclick = () => start(mode);
$("back").onclick = home;
$("quit").onclick = home;
$("pl").onclick = () => { speak(false); $("inp").focus(); };
$("sl").onclick = () => { speak(true); $("inp").focus(); };
document.addEventListener("keydown", e => {
  if (state === "end" && e.key === "Enter") { e.preventDefault(); start(mode); return; }
  if (!["ask"].includes(state)) return;
  if (e.key === "Tab") { e.preventDefault(); speak(e.shiftKey); }
  else if (e.key === "Enter") { e.preventDefault(); submit(); }
});
home();
</script>
</body>
</html>
